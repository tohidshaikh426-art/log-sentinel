[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-sentinel-collector"
version = "1.0.0"
description = "Log Sentinel Python authentication log collector and rule-based detection engine"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
